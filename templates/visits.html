{{define "visits"}}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Visits - Bird List</title><style>:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#10b981}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}.shell{display:flex;min-height:100vh}.sidebar{width:220px;background:var(--card);padding:1.5rem;position:sticky;top:0;height:100vh}.brand{color:var(--accent);font-weight:700;font-size:1.25rem;margin-bottom:2rem}.nav a{display:block;color:var(--muted);text-decoration:none;padding:.7rem;border-radius:7px;margin:.3rem 0}.nav a:hover,.nav a.active{background:#163e37;color:var(--accent)}main{width:min(980px,100%);padding:2rem;margin:auto}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.25rem}.muted{color:var(--muted)}.visits{list-style:none;padding:0;margin:0}.visits li{border-bottom:1px solid var(--border)}.visits li:last-child{border:0}.visits a{display:block;color:var(--text);text-decoration:none;padding:1rem 0}.visits a:hover{color:var(--accent)}@media(max-width:650px){.sidebar{width:100%;height:auto;position:static}.shell{display:block}.nav{display:flex;gap:.5rem}.nav a{margin:0}.brand{margin-bottom:.75rem}}</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">Bird List</div><nav class="nav"><a href="/">Home</a><a href="/species">Species</a><a class="active" href="/visits">Visits</a><a href="/settings">Settings</a></nav></aside><main><h1>Visits</h1>{{if .Visits}}<ul class="visits">{{range .Visits}}<li><a href="{{.URL}}"><strong>{{.Location}}</strong><span class="muted"> - {{.Date.Format "2006-01-02"}}, {{.StartTime.Format "15:04"}}{{if .EndTime}}-{{.EndTime}}{{end}}</span></a></li>{{end}}</ul>{{else}}<p class="muted">No visits yet.</p>{{end}}</main></div></body></html>{{end}}
